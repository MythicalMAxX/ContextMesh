# Per-developer node configuration (~/.agent-network/node.yaml). Created by "agent-network join"; edit to taste.
hub: https://agent-network-hub.<your-account>.workers.dev
org: acme
developer: developer-b
identity: identity.json
database: graph.db

# What agents may look at. Created by "agent-network setup". Once any project exists, nothing outside the projects is
# indexed or served, and agents are told these folders and descriptions instead of searching your computer.
projects:
  dashboard:
    description: Customer dashboard (React). Run npm test.
    paths: [D:/code/dashboard]
    repository: dashboard   # makes this folder the local checkout of that manifest repository

# How this node runs an agent by itself. You choose the tool AND the model; there is no silent default.
agents:
  profiles:
    background: { tool: claude-code, model: haiku }

# Optional task sources indexed by this node.
tasks:
  - { type: file, path: tasks.yaml }

# owner_authoritative: memory about a component from its owning team applies automatically; anything else waits
# for your approval. "manual" makes every update wait; "all" applies everything from verified members.
policy: { apply_updates: owner_authoritative }

# Answer URGENT enquiries about your components while you are away (read-only headless agent).
responder:
  enabled: false
  profile: background   # read-only, limited to the project folders, with the model chosen above
  timeout_seconds: 120
  max_per_hour: 20
  max_per_day: 100

dashboard: { host: 127.0.0.1, port: 7421 }
index: { interval_minutes: 15 }
